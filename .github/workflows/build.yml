name: OpenWrt Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device (all = every device config the overlays carry)'
        required: false
        type: choice
        default: all
        options:
          - all
          - uz801
          - uf02
          - m9s
          - mf68e
      openwrt_version:
        description: 'OpenWrt branch, tag, or tag pattern (newest match wins)'
        required: false
        type: string
        default: 'v25.12.*'
      packages:
        description: 'Extra packages to build into the image (space separated)'
        required: false
        type: string
      imagebuilder:
        description: 'Build the image builder'
        required: false
        type: boolean
        default: true
      sdk:
        description: 'Build the SDK'
        required: false
        type: boolean
        default: true
      release:
        description: 'Publish a GitHub release (tag: <openwrt>-<sha>)'
        required: false
        type: boolean
        default: false
      release_suffix:
        description: 'Appended to the generated release tag'
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a prerelease'
        required: false
        type: boolean
        default: false

  # callable from another workflow
  workflow_call:
    inputs:
      device:
        required: false
        type: string
        default: all
      openwrt_version:
        required: false
        type: string
        default: 'v25.12.*'
      packages:
        required: false
        type: string
      imagebuilder:
        required: false
        type: boolean
        default: true
      sdk:
        required: false
        type: boolean
        default: true
      release:
        required: false
        type: boolean
        default: false
      release_suffix:
        required: false
        type: string
      prerelease:
        required: false
        type: boolean
        default: false

env:
  UPLOAD_FIRMWARE: true
  TZ: Europe/Madrid

jobs:
  resolve-version:
    runs-on: ubuntu-22.04
    outputs:
      openwrt_version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
    - name: Resolve the OpenWrt version
      id: resolve
      # through the environment, so neither input is pasted into the script
      env:
        OPENWRT_INPUT: ${{ inputs.openwrt_version }}
        RELEASE_SUFFIX: ${{ inputs.release_suffix }}
      run: |
        VERSION="${OPENWRT_INPUT:-v25.12.*}"

        # a pattern resolves to the newest matching tag, anything else is a
        # branch or tag and is used as it is
        case "$VERSION" in
          *'*'*|*'?'*)
            PATTERN="$VERSION"
            VERSION=$(git ls-remote --tags https://git.openwrt.org/openwrt/openwrt.git "$PATTERN" \
              | sed 's|.*refs/tags/||' | grep -v '\^{}$' | sort -V | tail -1)
            if [ -z "$VERSION" ]; then
              echo "ERROR: no OpenWrt tag matches $PATTERN"
              exit 1
            fi
            echo "Resolved $PATTERN -> $VERSION"
            ;;
        esac

        echo "Using OpenWrt $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        # the release names itself after what it is: the OpenWrt version it was
        # built from and the commit of this repository that built it, so the
        # same commit and version always produce the same tag
        SUFFIX="$RELEASE_SUFFIX"
        TAG="$VERSION-${GITHUB_SHA:0:7}${SUFFIX:+-${SUFFIX#-}}"

        # whatever a branch name or a suffix carries, a tag cannot
        TAG=$(printf '%s' "$TAG" | tr -c 'A-Za-z0-9._-' '-' | sed 's|^-*||; s|-*$||')

        echo "Release tag: $TAG"
        echo "release_tag=$TAG" >> $GITHUB_OUTPUT

  build:
    needs: resolve-version
    runs-on: ubuntu-22.04

    env:
      OPENWRT_VERSION: ${{ needs.resolve-version.outputs.openwrt_version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: |
        echo "::group::Reclaiming disk space"
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo timedatectl set-timezone "$TZ"
        df -h /
        echo "::endgroup::"

    # Every device is built in this one job, swapping .config between them, so
    # the toolchain and the staging directory are built once. The configs are
    # ordered so that the ones sharing an overlay follow each other, and the
    # tree is only cleaned when the overlays change.
    - name: Select the device configs
      run: |
        DEVICE="${{ inputs.device }}"

        if [ -n "$DEVICE" ] && [ "$DEVICE" != "all" ]; then
          DEVICES="$DEVICE"
        else
          # one line per device would break $GITHUB_ENV, so keep them on one
          DEVICES=$(ls openwrt-*/configs/diffconfig_* | sed 's|.*/diffconfig_||' | tr '\n' ' ')
        fi

        echo "Building: $DEVICES"
        echo "DEVICES=$DEVICES" >> $GITHUB_ENV

        # the header of the table every build step appends a row to, so the run
        # page says what was built without a log being opened
        {
          echo "## OpenWrt $OPENWRT_VERSION"
          echo
          echo "| Device | Overlay | Result | Time |"
          echo "| --- | --- | --- | --- |"
        } >> $GITHUB_STEP_SUMMARY

    # build.sh appends this to the device config of the overlay it applies
    - name: Compose the extra configuration
      run: |
        {
          echo "EXTRA_CONFIG<<GHA_EOF"
          for pkg in ${{ inputs.packages }}; do
            echo "CONFIG_PACKAGE_${pkg}=y"
          done
          if [ "${{ inputs.imagebuilder }}" = "true" ]; then
            echo "CONFIG_IB=y"
          fi
          if [ "${{ inputs.sdk }}" = "true" ]; then
            echo "CONFIG_SDK=y"
          fi
          echo "GHA_EOF"
        } >> $GITHUB_ENV

    # Restored and saved as separate steps, because actions/cache only saves
    # when the job succeeds and a failed build is exactly when the hours of
    # toolchain already compiled are worth keeping. The save steps run with
    # if: always(), so a run that dies halfway still leaves them behind.
    - name: Restore OpenWrt downloads
      uses: actions/cache/restore@v4
      with:
        path: openwrt/dl
        key: openwrt-dl-${{ needs.resolve-version.outputs.openwrt_version }}-${{ github.run_id }}
        restore-keys: |
          openwrt-dl-${{ needs.resolve-version.outputs.openwrt_version }}-
          openwrt-dl-

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: openwrt/.ccache
        key: openwrt-ccache-${{ needs.resolve-version.outputs.openwrt_version }}-${{ github.run_id }}
        restore-keys: |
          openwrt-ccache-${{ needs.resolve-version.outputs.openwrt_version }}-
          openwrt-ccache-

    # The host tools and the cross toolchain depend on the OpenWrt version and
    # the build container, not on our overlays, so they survive between runs.
    # staging_dir/target-* is deliberately left out: it holds the stamps for the
    # target packages, and restoring those would keep a changed package of ours
    # from being rebuilt.
    - name: Restore the toolchain
      uses: actions/cache/restore@v4
      with:
        path: |
          openwrt/staging_dir/host
          openwrt/staging_dir/hostpkg
          openwrt/staging_dir/toolchain-*
          openwrt/build_dir/host
          openwrt/build_dir/toolchain-*
        key: openwrt-toolchain-${{ needs.resolve-version.outputs.openwrt_version }}-${{ hashFiles('.github/dev/Dockerfile') }}-${{ github.run_id }}
        restore-keys: |
          openwrt-toolchain-${{ needs.resolve-version.outputs.openwrt_version }}-${{ hashFiles('.github/dev/Dockerfile') }}-
          openwrt-toolchain-${{ needs.resolve-version.outputs.openwrt_version }}-

    # build.sh builds the image from .github/dev/Dockerfile, fetches OpenWrt,
    # applies the overlay that owns the config, installs the feeds and that
    # config, then runs the command in the tree. One step per device, so the
    # log shows at a glance which ones got built and which one broke.
    - name: Build uf02
      if: contains(format(' {0} ', env.DEVICES), ' uf02 ')
      run: .github/dev/ci-build.sh uf02

    - name: Build uz801
      if: contains(format(' {0} ', env.DEVICES), ' uz801 ')
      run: .github/dev/ci-build.sh uz801

    - name: Build m9s
      if: contains(format(' {0} ', env.DEVICES), ' m9s ')
      run: .github/dev/ci-build.sh m9s

    - name: Build mf68e
      if: contains(format(' {0} ', env.DEVICES), ' mf68e ')
      run: .github/dev/ci-build.sh mf68e

    # The run page will not render a full OpenWrt build log, so the steps only
    # print it inside collapsed groups and the whole thing is kept here.
    - name: Upload the build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ inputs.device }}-${{ github.run_attempt }}
        path: logs/*.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Stamp the build
      if: always()
      run: echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # if: always(), so a failed build still leaves the downloads, the ccache and
    # the toolchain it did get through behind for the next run to start from.
    - name: Save OpenWrt downloads
      if: always()
      uses: actions/cache/save@v4
      with:
        path: openwrt/dl
        key: openwrt-dl-${{ needs.resolve-version.outputs.openwrt_version }}-${{ github.run_id }}

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: openwrt/.ccache
        key: openwrt-ccache-${{ needs.resolve-version.outputs.openwrt_version }}-${{ github.run_id }}

    - name: Save the toolchain
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          openwrt/staging_dir/host
          openwrt/staging_dir/hostpkg
          openwrt/staging_dir/toolchain-*
          openwrt/build_dir/host
          openwrt/build_dir/toolchain-*
        key: openwrt-toolchain-${{ needs.resolve-version.outputs.openwrt_version }}-${{ hashFiles('.github/dev/Dockerfile') }}-${{ github.run_id }}

    - name: ccache statistics
      if: always()
      # build.sh wants a device even when the command does not care about it
      run: |
        echo "::group::ccache statistics"
        ./build.sh --device "${DEVICES%% *}" env CCACHE_DIR=.ccache ccache -s || true
        echo "::endgroup::"

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: openwrt_firmware_${{ inputs.device }}_${{needs.resolve-version.outputs.openwrt_version}}_${{ env.FILE_DATE }}
        path: |
          ${{ env.FIRMWARE }}/*-squashfs-gpt_both0.bin
          ${{ env.FIRMWARE }}/*-squashfs-boot.img
          ${{ env.FIRMWARE }}/*-squashfs-system.img
          ${{ env.FIRMWARE }}/*-squashfs-sysupgrade.bin
          ${{ env.FIRMWARE }}/*.manifest
          ${{ env.FIRMWARE }}/*-flash.sh
          ${{ env.FIRMWARE }}/*-firmware.zip
          ${{ env.FIRMWARE }}/openwrt-imagebuilder-*
          ${{ env.FIRMWARE }}/openwrt-sdk-*
          ${{ env.FIRMWARE }}/packages

  # only when the run asked for a release
  release:
    needs: [resolve-version, build]
    if: inputs.release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Download the firmware artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    # one archive per device, out of the images that share a manifest
    - name: Create the release archives
      run: |
        mkdir -p release
        cd artifacts/openwrt_firmware_*

        for manifest in *.manifest; do
          [ -e "$manifest" ] || continue
          base="${manifest%.manifest}"
          zip -qj "$GITHUB_WORKSPACE/release/${base}.zip" "$base"*
          echo "packed ${base}.zip"
        done

        for extra in openwrt-imagebuilder-* openwrt-sdk-*; do
          [ -e "$extra" ] || continue
          cp "$extra" "$GITHUB_WORKSPACE/release/"
          echo "added $extra"
        done

        if [ -d packages ]; then
          zip -qr "$GITHUB_WORKSPACE/release/packages.zip" packages
          echo "packed packages.zip"
        fi

        if [ -z "$(ls -A "$GITHUB_WORKSPACE/release")" ]; then
          echo "ERROR: the build produced no artifacts to release"
          exit 1
        fi

        ls -lh "$GITHUB_WORKSPACE/release"

    - name: Create the release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ needs.resolve-version.outputs.release_tag }}
        name: ${{ needs.resolve-version.outputs.release_tag }}
        body: |
          OpenWrt firmware for MSM8916 devices.

          - Device: `${{ inputs.device }}`
          - OpenWrt: `${{ needs.resolve-version.outputs.openwrt_version }}`
          - Extra packages: `${{ inputs.packages }}`
          - Built from `${{ github.sha }}`

          Each archive holds the flashable images (`gpt_both0.bin`, `boot.img`,
          `system.img`), the sysupgrade image, `flash.sh`, the package feed, and
          the image builder and SDK when they were built.
        files: release/*
        draft: false
        prerelease: ${{ inputs.prerelease }}
